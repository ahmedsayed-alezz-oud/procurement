<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام المشتريات — العز للعود</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f8f9fb;--surface:#fff;--text:#1a1a2e;--muted:#6b7280;
  --primary:#2563eb;--primary-light:#dbeafe;--danger:#ef4444;--danger-light:#fee2e2;
  --success:#16a34a;--success-light:#dcfce7;--warn:#f59e0b;--warn-light:#fef3c7;
  --border:#e5e7eb;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08);
  --chart-1:#2563eb;--chart-2:#7c3aed;--chart-3:#059669;--chart-4:#dc2626;
  --chart-5:#d97706;--chart-6:#0891b2;--chart-7:#db2777;--chart-8:#4f46e5;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f172a;--surface:#1e293b;--text:#e2e8f0;--muted:#94a3b8;
    --primary:#3b82f6;--primary-light:#1e3a5f;--danger:#f87171;--danger-light:#3f1d1d;
    --success:#4ade80;--success-light:#14532d;--warn:#fbbf24;--warn-light:#422006;
    --border:#334155;--shadow:0 1px 3px rgba(0,0,0,.3);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans Arabic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar .brand .logo-wrap{background:#fff;padding:4px 10px;border-radius:6px;display:flex;align-items:center}
.topbar .brand img{height:26px;width:auto;object-fit:contain;display:block}
.topbar h1{font-size:16px;font-weight:700;color:var(--primary)}
.topbar .whoami{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.container{max-width:1400px;margin:0 auto;padding:16px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px;background:var(--surface);padding:6px;border-radius:var(--radius);box-shadow:var(--shadow)}
.tabs button{border:none;background:transparent;padding:8px 14px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--muted);transition:.2s}
.tabs button.active{background:var(--primary);color:#fff;font-weight:600}
.tabs button:hover:not(.active){background:var(--primary-light);color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);font-weight:600;text-align:right;padding:8px 10px;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:hover td{background:var(--primary-light)}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 16px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{opacity:.85}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.small{padding:4px 10px;font-size:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.field{flex:1;min-width:160px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:inherit;font-size:13px;background:var(--surface);color:var(--text)}
.field textarea{min-height:60px;resize:vertical}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.ok{background:var(--success-light);color:var(--success)}
.badge.warn{background:var(--warn-light);color:var(--warn)}
.badge.bad{background:var(--danger-light);color:var(--danger)}
.badge.info{background:var(--primary-light);color:var(--primary)}
.muted{font-size:12px;color:var(--muted)}

/* KPI Dashboard */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi-card .kpi-icon{font-size:28px;margin-bottom:6px}
.kpi-card .kpi-value{font-size:28px;font-weight:700;line-height:1.2}
.kpi-card .kpi-label{font-size:12px;color:var(--muted);margin-top:4px}
.kpi-card .kpi-bar{position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--border)}
.kpi-card .kpi-bar-fill{height:100%;border-radius:0 2px 2px 0;transition:width .5s}
.kpi-card.green .kpi-value{color:var(--success)}
.kpi-card.green .kpi-bar-fill{background:var(--success)}
.kpi-card.red .kpi-value{color:var(--danger)}
.kpi-card.red .kpi-bar-fill{background:var(--danger)}
.kpi-card.blue .kpi-value{color:var(--primary)}
.kpi-card.blue .kpi-bar-fill{background:var(--primary)}
.kpi-card.amber .kpi-value{color:var(--warn)}
.kpi-card.amber .kpi-bar-fill{background:var(--warn)}

.charts-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;margin-top:14px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.chart-card h4{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text)}
.chart-card canvas{max-height:280px}

/* Comparison */
.compare-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.supplier-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.supplier-card h4{font-size:15px;font-weight:700;margin-bottom:10px;color:var(--primary)}
.supplier-card .stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.supplier-card .stat-row:last-child{border-bottom:none}
.supplier-card .stat-label{color:var(--muted)}
.supplier-card .stat-value{font-weight:600}

/* Nama toggle */
.nama-toggle{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);cursor:pointer}
.nama-toggle.uploaded{border-color:var(--success);background:var(--success-light)}
.nama-toggle input{width:auto}

/* Auth */
.auth-box{max-width:360px;margin:80px auto;background:var(--surface);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow);text-align:center}
.auth-box h2{margin-bottom:16px;font-size:18px;color:var(--primary)}
.auth-box p{color:var(--muted);font-size:13px;margin-bottom:16px}
.pending-box{max-width:400px;margin:80px auto;text-align:center}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--surface);border-radius:var(--radius);padding:24px;max-width:680px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--primary)}

/* Toast */
.toast-root{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200}
.toast-msg{background:var(--text);color:var(--bg);padding:10px 20px;border-radius:8px;font-size:13px;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Attachment area */
.attach-area{border:2px dashed var(--border);border-radius:var(--radius);padding:16px;text-align:center;margin-top:10px}
.attach-area.dragover{border-color:var(--primary);background:var(--primary-light)}
.attach-list{margin-top:8px;font-size:12px}
.attach-list a{color:var(--primary);text-decoration:none}
.attach-list a:hover{text-decoration:underline}

@media(max-width:640px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .charts-row{grid-template-columns:1fr}
  .compare-grid{grid-template-columns:1fr}
  .row{flex-direction:column}
  .row>.field{min-width:100%}
  .topbar{padding:8px 12px}
  .container{padding:10px}
}
</style>
</head>

<script>
// ============================================================
// CONFIG & INIT
// ============================================================
const SUPABASE_URL = 'https://rpbxrtteuwldqhlkgfro.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwYnhydHRldXdsZHFobGtnZnJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNjk2NjQsImV4cCI6MjEwODg0NTY2NH0.5ei5DrLLUFXeOgT6t_KyWoxUrbIoCx8RLerroA0nkdg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function emailFor(input){
  if (input.includes('@')) return input;
  return input.trim().toLowerCase() + '@users.alezz-oud.com';
}

// ============================================================
// STATE
// ============================================================
let currentUser = null;
let currentProfile = null;
let activeTab = 'dashboard';
let cache = { suppliers:[], orders:[], lines:[], payments:[], shipments:[], season:[], profiles:[], audit:[], attachments:[], samples:[], warehouseReceipts:[], warehouseReceiptLines:[] };
let chartInstances = {};
let selectedOrderIds = new Set();
let dashFilter = { from:'', to:'', supplier:'', category:'' };

// ============================================================
// UTILITIES
// ============================================================
function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast-msg';
  el.textContent = msg;
  document.getElementById('toast-root').append(el);
  setTimeout(()=>el.remove(), 3000);
}
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('ar-SA') : '—'; }
function fmtNum(n){ return n!=null ? Number(n).toLocaleString('ar-SA',{maximumFractionDigits:2}) : '—'; }
function val(id){ return document.getElementById(id)?.value ?? ''; }

const CHART_COLORS = ['#2563eb','#7c3aed','#059669','#dc2626','#d97706','#0891b2','#db2777','#4f46e5','#84cc16','#f43f5e'];

// ============================================================
// AUTH
// ============================================================
let isSignup = false;
document.getElementById('a-toggle').onclick = (e) => {
  e.preventDefault();
  isSignup = !isSignup;
  document.getElementById('a-toggle').textContent = isSignup ? 'لديك حساب؟ سجل دخولك' : 'إنشاء حساب جديد';
  document.getElementById('a-submit').textContent = isSignup ? 'إنشاء حساب' : 'دخول';
};
document.getElementById('a-submit').onclick = async () => {
  const email = emailFor(val('a-user'));
  const pass = val('a-pass');
  if (!pass) { document.getElementById('a-error').textContent = 'أدخل كلمة المرور'; return; }
  document.getElementById('a-error').textContent = '';
  try {
    let res;
    if (isSignup) {
      res = await sb.auth.signUp({ email, password: pass, options:{ data:{ username: val('a-user').trim().toLowerCase() } } });
    } else {
      res = await sb.auth.signInWithPassword({ email, password: pass });
    }
    if (res.error) throw res.error;
  } catch(e) { document.getElementById('a-error').textContent = e.message; }
};

function signOut(){ sb.auth.signOut(); }

sb.auth.onAuthStateChange(async (event, session) => {
  currentUser = session?.user || null;
  await boot();
});

async function boot(){
  if (!currentUser) {
    showView('auth');
    document.getElementById('whoami').innerHTML = '';
    return;
  }
  const { data: profile } = await sb.from('erp_profiles').select('*').eq('id', currentUser.id).maybeSingle();
  currentProfile = profile;
  if (!profile || profile.role === 'pending') {
    showView('pending');
    document.getElementById('btn-signout-pending').onclick = signOut;
    return;
  }
  showView('app');
  renderWhoAmI();
  await refreshAll();
  const myTabs = TAB_DEFS.filter(t=>t.roles.includes(currentProfile.role));
  if (!myTabs.find(t=>t.id===activeTab)) activeTab = myTabs[0]?.id || 'dashboard';
  renderTabs();
  renderActiveTab();
}

function showView(v){
  ['auth-view','pending-view','app-view'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById(v+'-view').style.display = '';
}

function renderWhoAmI(){
  document.getElementById('whoami').innerHTML = `
    <span>${currentProfile.full_name || currentProfile.username} (${currentProfile.role})</span>
    <button class="btn small" onclick="signOut()">خروج</button>
  `;
}

// ============================================================
// DATA LOADING
// ============================================================
async function refreshAll(){
  const [s,o,l,p,sh,sp,pr,au,at,sm,wr,wl] = await Promise.all([
    sb.from('erp_suppliers').select('*').order('name'),
    sb.from('erp_purchase_orders').select('*').order('created_at',{ascending:false}),
    sb.from('erp_po_line_items').select('*').order('created_at'),
    sb.from('erp_payments').select('*').order('due_date'),
    sb.from('erp_shipments').select('*').order('created_at',{ascending:false}),
    sb.from('erp_season_plan').select('*').order('need_by_date'),
    sb.from('erp_profiles').select('*').order('username'),
    sb.from('erp_audit_log').select('*').order('changed_at',{ascending:false}).limit(100),
    sb.from('erp_attachments').select('*').order('created_at',{ascending:false}),
    sb.from('erp_samples').select('*').order('created_at',{ascending:false}),
    sb.from('erp_warehouse_receipts').select('*').order('created_at',{ascending:false}),
    sb.from('erp_warehouse_receipt_lines').select('*').order('created_at'),
  ]);
  cache.suppliers = s.data||[];
  cache.orders = o.data||[];
  cache.lines = l.data||[];
  cache.payments = p.data||[];
  cache.shipments = sh.data||[];
  cache.season = sp.data||[];
  cache.profiles = pr.data||[];
  cache.audit = au.data||[];
  cache.attachments = at.data||[];
  cache.samples = sm.data||[];
  cache.warehouseReceipts = wr.data||[];
  cache.warehouseReceiptLines = wl.data||[];
}

function supplierName(id){ const s = cache.suppliers.find(x=>x.id===id); return s ? s.name : '—'; }
function linesFor(poId){ return cache.lines.filter(l=>l.po_id===poId); }
function paymentsFor(poId){ return cache.payments.filter(p=>p.po_id===poId); }
function shipmentsFor(poId){ return cache.shipments.filter(s=>s.po_id===poId); }
function attachmentsFor(entityType, entityId){ return cache.attachments.filter(a=>a.entity_type===entityType && a.entity_id===entityId); }
function receiptLinesFor(receiptId){ return cache.warehouseReceiptLines.filter(l=>l.receipt_id===receiptId); }

// ============================================================
// TAB SYSTEM
// ============================================================
const TAB_DEFS = [
  {id:'dashboard', label:'لوحة المؤشرات', icon:'📊', roles:['manager','data_entry','finance','viewer']},
  {id:'orders', label:'أوامر الشراء', icon:'📋', roles:['manager','data_entry','finance','viewer']},
  {id:'aging', label:'تقادم الأوامر', icon:'⏱️', roles:['manager','data_entry','finance','viewer']},
  {id:'payments', label:'الدفعات', icon:'💰', roles:['manager','data_entry','finance','viewer']},
  {id:'shipments', label:'الشحنات', icon:'🚢', roles:['manager','data_entry','finance','viewer','warehouse']},
  {id:'season', label:'خطة الموسم', icon:'📅', roles:['manager','data_entry','viewer']},
  {id:'suppliers', label:'الموردون', icon:'🏭', roles:['manager','data_entry','viewer']},
  {id:'samples', label:'العينات', icon:'🧪', roles:['manager','data_entry','viewer']},
  {id:'warehouse_receipts', label:'استلام المستودع', icon:'📥', roles:['manager','data_entry','finance','viewer','warehouse']},
  {id:'comparison', label:'مقارنة الموردين', icon:'⚖️', roles:['manager','finance','viewer']},
  {id:'audit', label:'سجل التعديلات', icon:'📝', roles:['manager']},
  {id:'users', label:'المستخدمون', icon:'👥', roles:['manager']},
];

function renderTabs(){
  const root = document.getElementById('tabs');
  root.innerHTML = TAB_DEFS.filter(t=>t.roles.includes(currentProfile.role))
    .map(t=>`<button data-tab="${t.id}" class="${t.id===activeTab?'active':''}">${t.icon} ${t.label}</button>`).join('');
  root.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ activeTab=b.dataset.tab; renderTabs(); renderActiveTab(); };
  });
}

function canWrite(){ return ['manager','data_entry'].includes(currentProfile.role); } // يضيف سجلات جديدة
function canDelete(){ return currentProfile.role === 'manager'; }
function canFullAccess(){ return currentProfile.is_full_access === true; }
function canEditExisting(){ return currentProfile.role === 'manager'; } // تعديل سجل محفوظ — المدير فقط (ما عدا استلام المستودع تحت)
function canWarehouse(){ return currentProfile.role === 'warehouse'; }
function canWriteReceipts(){ return canWrite() || canWarehouse(); } // إضافة استلام
function canEditReceipts(){ return canEditExisting() || canWarehouse(); } // تعديل استلام محفوظ
function ownsRow(row){ return row.created_by === currentUser.id || currentProfile.role === 'manager'; }

function renderActiveTab(){
  const root = document.getElementById('tab-content');
  // Destroy old chart instances
  Object.values(chartInstances).forEach(c=>c.destroy());
  chartInstances = {};

  const renderers = {
    dashboard: renderDashboard,
    orders: renderOrders,
    aging: renderAging,
    payments: renderPayments,
    shipments: renderShipments,
    season: renderSeason,
    suppliers: renderSuppliers,
    samples: renderSamples,
    warehouse_receipts: renderWarehouseReceipts,
    comparison: renderComparison,
    audit: renderAudit,
    users: renderUsers,
  };
  (renderers[activeTab] || (()=>{}))(root);
}

// ============================================================
// DASHBOARD — Enhanced KPIs + Charts
// ============================================================
function dashboardCategories(){
  return [...new Set(cache.lines.map(l=>l.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
}

function renderDashboard(root){
  // ---- Apply dashboard filters (date range / supplier / category) ----
  const fOrders = cache.orders.filter(o=>{
    if (dashFilter.from && (!o.order_date || o.order_date < dashFilter.from)) return false;
    if (dashFilter.to && (!o.order_date || o.order_date > dashFilter.to)) return false;
    if (dashFilter.supplier && o.supplier_id !== dashFilter.supplier) return false;
    return true;
  });
  const fOrderIds = new Set(fOrders.map(o=>o.id));
  const fLines = cache.lines.filter(l=> fOrderIds.has(l.po_id) && (!dashFilter.category || l.category === dashFilter.category));
  // When a category filter is active, keep only orders that actually have a matching line
  const scopedOrders = dashFilter.category ? fOrders.filter(o=> fLines.some(l=>l.po_id===o.id)) : fOrders;
  const scopedOrderIds = new Set(scopedOrders.map(o=>o.id));
  const fPayments = cache.payments.filter(p=>{
    if (dashFilter.supplier && p.supplier_id && p.supplier_id !== dashFilter.supplier) return false;
    if (p.po_id) return scopedOrderIds.has(p.po_id);
    return !dashFilter.category; // payments with no linked PO have no category to match
  });
  const fShipments = cache.shipments.filter(s=> s.po_id ? scopedOrderIds.has(s.po_id) : true);
  const dashLinesFor = (poId) => fLines.filter(l=>l.po_id===poId);
  const hasFilter = !!(dashFilter.from || dashFilter.to || dashFilter.supplier || dashFilter.category);

  const totalOrders = scopedOrders.length;
  const openOrders = scopedOrders.filter(o=>o.status!=='مُستلم' && o.status!=='مُلغى').length;

  // Data completeness
  const reqFields = ['po_number','supplier_id','order_date','currency','status'];
  let filled = 0, total = 0;
  scopedOrders.forEach(o=>{ reqFields.forEach(f=>{ total++; if(o[f]) filled++; }); });
  const completeness = total ? Math.round(filled/total*100) : 0;

  // Spend by supplier
  const spendBySupplier = {};
  scopedOrders.forEach(o=>{
    const lines = dashLinesFor(o.id);
    const spend = lines.reduce((s,l)=>s+(l.line_total||l.unit_price*l.quantity||0),0);
    const name = supplierName(o.supplier_id);
    spendBySupplier[name] = (spendBySupplier[name]||0) + spend;
  });
  const totalSpend = Object.values(spendBySupplier).reduce((a,b)=>a+b,0);
  const topSupplier = Object.entries(spendBySupplier).sort((a,b)=>b[1]-a[1])[0];
  const concentration = totalSpend ? Math.round((topSupplier?.[1]||0)/totalSpend*100) : 0;

  // HHI (Herfindahl-Hirschman Index)
  const hhi = totalSpend ? Object.values(spendBySupplier).reduce((sum,v)=>sum+Math.pow(v/totalSpend*100,2),0) : 0;

  // Spend by currency
  const spendByCurrency = {};
  scopedOrders.forEach(o=>{
    const lines = dashLinesFor(o.id);
    const spend = lines.reduce((s,l)=>s+(l.line_total||l.unit_price*l.quantity||0),0);
    const cur = o.currency || 'غير محدد';
    spendByCurrency[cur] = (spendByCurrency[cur]||0) + spend;
  });

  // Payment status
  const payStatusCounts = {مستحقة:0, مطلوبة:0, مُعتمدة:0, 'مُحوَّلة':0};
  fPayments.forEach(p=>{ if(payStatusCounts[p.status]!==undefined) payStatusCounts[p.status]++; });

  // Overdue payments
  const today = new Date().toISOString().slice(0,10);
  const overdue = fPayments.filter(p=>p.due_date && p.due_date < today && p.status!=='مُحوَّلة');

  // Season adherence (not scoped by order/category filters — plan-level indicator)
  const linkedSeason = cache.season.filter(s=>s.linked_po_id);
  const seasonAdherence = cache.season.length ? Math.round(linkedSeason.length/cache.season.length*100) : 0;

  // Nama soft upload rate
  const namaUploaded = scopedOrders.filter(o=>o.nama_uploaded).length;
  const namaRate = totalOrders ? Math.round(namaUploaded/totalOrders*100) : 0;

  // Data quality issues
  const noDate = scopedOrders.filter(o=>!o.order_date).length;
  const noPrice = fLines.filter(l=>!l.unit_price && !l.line_total).length;

  // Order types
  const domestic = scopedOrders.filter(o=>o.order_type==='محلي').length;
  const international = scopedOrders.filter(o=>o.order_type==='دولي').length;

  // Active shipments
  const activeShipments = fShipments.filter(s=>s.status!=='مُستلم').length;

  // Closed orders + active suppliers + avg order value (SAR)
  const closedOrders = scopedOrders.filter(o=>o.status==='مُستلم').length;
  const activeSuppliersCount = cache.suppliers.filter(s=>s.is_active!==false).length;
  const ordersWithSar = scopedOrders.filter(o=>o.total_sar);
  const totalSarAll = ordersWithSar.reduce((s,o)=>s+Number(o.total_sar||0),0);
  const avgOrderValueSar = ordersWithSar.length ? totalSarAll/ordersWithSar.length : 0;

  // PO age (days) — open orders only
  const msDay = 1000*60*60*24;
  const nowMs = Date.now();
  const openAges = scopedOrders
    .filter(o=>o.status!=='مُستلم' && o.status!=='مُلغى' && o.order_date)
    .map(o=>Math.floor((nowMs - new Date(o.order_date).getTime())/msDay));
  const avgOpenAge = openAges.length ? Math.round(openAges.reduce((a,b)=>a+b,0)/openAges.length) : 0;
  const oldestOpenAge = openAges.length ? Math.max(...openAges) : 0;

  // Commitments & outstanding payments by currency (cannot sum across currencies without a conversion rate per payment — shown as a breakdown, not invented as one figure)
  const commitByCur = {}, outstandingByCur = {};
  fPayments.forEach(p=>{
    const cur = p.currency || 'غير محدد';
    commitByCur[cur] = (commitByCur[cur]||0) + Number(p.amount||0);
    if (p.status !== 'مُحوَّلة') outstandingByCur[cur] = (outstandingByCur[cur]||0) + Number(p.amount||0);
  });

  root.innerHTML = `
    <!-- Filters -->
    <div class="card" style="margin-bottom:14px">
      <div class="toolbar" style="flex-wrap:wrap;gap:10px;align-items:flex-end">
        <div class="row" style="flex:1;flex-wrap:wrap;gap:10px">
          <div class="field" style="margin:0;min-width:140px"><label>من تاريخ</label><input type="date" id="dash-from" value="${dashFilter.from}"></div>
          <div class="field" style="margin:0;min-width:140px"><label>إلى تاريخ</label><input type="date" id="dash-to" value="${dashFilter.to}"></div>
          <div class="field" style="margin:0;min-width:180px"><label>المورد</label>
            <select id="dash-supplier"><option value="">كل الموردين</option>${supplierOptions(dashFilter.supplier)}</select>
          </div>
          <div class="field" style="margin:0;min-width:160px"><label>الصنف</label>
            <select id="dash-category"><option value="">كل الأصناف</option>${dashboardCategories().map(c=>`<option value="${c}" ${dashFilter.category===c?'selected':''}>${c}</option>`).join('')}</select>
          </div>
        </div>
        <button class="btn small" id="dash-clear-filter" ${hasFilter?'':'disabled'}>مسح الفلاتر</button>
      </div>
      ${hasFilter ? `<p class="muted" style="margin-top:8px">📍 عرض مُفلتر — ${totalOrders} من ${cache.orders.length} أمر شراء. كل المؤشرات والرسوم أدناه محسوبة على النطاق المُفلتر.</p>` : ''}
    </div>

    <!-- KPI Cards -->
    <div class="kpi-grid">
      <div class="kpi-card blue">
        <div class="kpi-icon">📦</div>
        <div class="kpi-value">${totalOrders}</div>
        <div class="kpi-label">إجمالي أوامر الشراء</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:100%"></div></div>
      </div>
      <div class="kpi-card ${openOrders > 0 ? 'amber' : 'green'}">
        <div class="kpi-icon">📂</div>
        <div class="kpi-value">${openOrders}</div>
        <div class="kpi-label">أوامر مفتوحة</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${totalOrders?Math.round(openOrders/totalOrders*100):0}%"></div></div>
      </div>
      <div class="kpi-card ${completeness>=80?'green':completeness>=50?'amber':'red'}">
        <div class="kpi-icon">✅</div>
        <div class="kpi-value">${completeness}%</div>
        <div class="kpi-label">اكتمال البيانات</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${completeness}%"></div></div>
      </div>
      <div class="kpi-card ${concentration>70?'red':concentration>50?'amber':'green'}">
        <div class="kpi-icon">⚠️</div>
        <div class="kpi-value">${concentration}%</div>
        <div class="kpi-label">تركّز المورد الأعلى${topSupplier ? ' ('+topSupplier[0]+')' : ''}</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${concentration}%"></div></div>
      </div>
      <div class="kpi-card ${overdue.length>0?'red':'green'}">
        <div class="kpi-icon">💸</div>
        <div class="kpi-value">${overdue.length}</div>
        <div class="kpi-label">دفعات متأخرة</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${fPayments.length?Math.round(overdue.length/fPayments.length*100):0}%"></div></div>
      </div>
      <div class="kpi-card ${seasonAdherence>=70?'green':seasonAdherence>=40?'amber':'red'}">
        <div class="kpi-icon">📅</div>
        <div class="kpi-value">${seasonAdherence}%</div>
        <div class="kpi-label">الالتزام بخطة الموسم</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${seasonAdherence}%"></div></div>
      </div>
      <div class="kpi-card ${namaRate>=80?'green':namaRate>=50?'amber':'red'}">
        <div class="kpi-icon">📤</div>
        <div class="kpi-value">${namaRate}%</div>
        <div class="kpi-label">نسبة الرفع لنما سوفت</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${namaRate}%"></div></div>
      </div>
      <div class="kpi-card blue">
        <div class="kpi-icon">🚢</div>
        <div class="kpi-value">${activeShipments}</div>
        <div class="kpi-label">شحنات نشطة</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${fShipments.length?Math.round(activeShipments/fShipments.length*100):0}%"></div></div>
      </div>
      <div class="kpi-card green">
        <div class="kpi-icon">✔️</div>
        <div class="kpi-value">${closedOrders}</div>
        <div class="kpi-label">أوامر مُغلقة (مُستلمة)</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${totalOrders?Math.round(closedOrders/totalOrders*100):0}%"></div></div>
      </div>
      <div class="kpi-card blue">
        <div class="kpi-icon">🏭</div>
        <div class="kpi-value">${activeSuppliersCount}</div>
        <div class="kpi-label">موردون نشطون</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:100%"></div></div>
      </div>
      <div class="kpi-card blue">
        <div class="kpi-icon">💵</div>
        <div class="kpi-value">${fmtNum(totalSarAll)}</div>
        <div class="kpi-label">إجمالي المبلغ (ر.س)</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:100%"></div></div>
      </div>
      <div class="kpi-card blue">
        <div class="kpi-icon">📐</div>
        <div class="kpi-value">${fmtNum(avgOrderValueSar)}</div>
        <div class="kpi-label">متوسط قيمة الأمر (ر.س)</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:100%"></div></div>
      </div>
      <div class="kpi-card ${avgOpenAge>60?'red':avgOpenAge>30?'amber':'green'}">
        <div class="kpi-icon">⏱️</div>
        <div class="kpi-value">${avgOpenAge}</div>
        <div class="kpi-label">متوسط عمر الأمر المفتوح (يوم)</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${Math.min(avgOpenAge,100)}%"></div></div>
      </div>
      <div class="kpi-card ${oldestOpenAge>90?'red':oldestOpenAge>45?'amber':'green'}">
        <div class="kpi-icon">⌛</div>
        <div class="kpi-value">${oldestOpenAge}</div>
        <div class="kpi-label">أقدم أمر مفتوح (يوم)</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${Math.min(oldestOpenAge,100)}%"></div></div>
      </div>
    </div>

    <!-- Financial commitments breakdown (by currency — summed per currency only; no invented FX conversion) -->
    <div class="card" style="margin-top:14px">
      <strong>الالتزامات المالية والدفعات المتبقية (حسب العملة)</strong>
      <table style="margin-top:8px">
        <thead><tr><th>العملة</th><th>إجمالي الالتزامات</th><th>المتبقي (غير محوَّل)</th></tr></thead>
        <tbody>
          ${Object.keys(commitByCur).length ? Object.keys(commitByCur).map(cur=>`
            <tr><td>${cur}</td><td>${fmtNum(commitByCur[cur])}</td><td>${fmtNum(outstandingByCur[cur]||0)}</td></tr>
          `).join('') : '<tr><td colspan="3" class="muted">لا توجد دفعات مسجلة</td></tr>'}
        </tbody>
      </table>
      <p class="muted" style="margin-top:6px">⚠️ التوفير (savings) وعدد الأصناف المفاوَض عليها غير متاحين هنا — يتطلبان ربط بيانات التوفير الحيّة بأوامر الشراء، وهي غير موجودة بعد في جداول erp_*. لا نعرض أرقامًا مُخترَعة لهذين المؤشرين.</p>
    </div>

    <!-- Data Quality Alerts -->
    ${(noDate > 0 || noPrice > 0) ? `
    <div class="card" style="margin-top:14px;border-color:var(--warn);background:var(--warn-light)">
      <strong style="color:var(--warn)">⚠️ تنبيهات جودة البيانات</strong>
      <div style="margin-top:6px;font-size:13px;color:var(--text)">
        ${noDate > 0 ? `<div>• ${noDate} أمر شراء بدون تاريخ (${Math.round(noDate/totalOrders*100)}%)</div>` : ''}
        ${noPrice > 0 ? `<div>• ${noPrice} بند بدون سعر (${fLines.length?Math.round(noPrice/fLines.length*100):0}%)</div>` : ''}
      </div>
    </div>` : ''}

    <!-- Charts -->
    <div class="charts-row">
      <div class="chart-card">
        <h4>توزيع الإنفاق حسب المورد</h4>
        <canvas id="chart-supplier-spend"></canvas>
      </div>
      <div class="chart-card">
        <h4>الإنفاق حسب العملة</h4>
        <canvas id="chart-currency-spend"></canvas>
      </div>
      <div class="chart-card">
        <h4>حالة الدفعات</h4>
        <canvas id="chart-payment-status"></canvas>
      </div>
      <div class="chart-card">
        <h4>الأوامر: محلي vs دولي</h4>
        <canvas id="chart-order-type"></canvas>
      </div>
    </div>

    <p class="muted" style="margin-top:14px">المؤشرات محسوبة مباشرة من السجل الحالي (محسوب) — تُحدَّث لحظيًا. HHI = ${Math.round(hhi)}</p>
  `;

  // Filter controls
  root.querySelector('#dash-from').onchange = (e) => { dashFilter.from = e.target.value; renderDashboard(root); };
  root.querySelector('#dash-to').onchange = (e) => { dashFilter.to = e.target.value; renderDashboard(root); };
  root.querySelector('#dash-supplier').onchange = (e) => { dashFilter.supplier = e.target.value; renderDashboard(root); };
  root.querySelector('#dash-category').onchange = (e) => { dashFilter.category = e.target.value; renderDashboard(root); };
  root.querySelector('#dash-clear-filter').onclick = () => {
    dashFilter = { from:'', to:'', supplier:'', category:'' };
    renderDashboard(root);
  };

  // Render charts after DOM is ready
  setTimeout(()=>{
    renderSupplierSpendChart(spendBySupplier);
    renderCurrencySpendChart(spendByCurrency);
    renderPaymentStatusChart(payStatusCounts);
    renderOrderTypeChart(domestic, international, totalOrders - domestic - international);
  }, 50);
}

function renderSupplierSpendChart(data){
  const ctx = document.getElementById('chart-supplier-spend');
  if (!ctx) return;
  const entries = Object.entries(data).sort((a,b)=>b[1]-a[1]).slice(0,8);
  chartInstances['supplier-spend'] = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: entries.map(e=>e[0]),
      datasets: [{ data: entries.map(e=>e[1]), backgroundColor: CHART_COLORS.slice(0, entries.length), borderWidth: 2, borderColor: getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: {
        legend: { position: 'bottom', rtl: true, labels: { font: { family: 'Noto Sans Arabic', size: 11 }, padding: 12 } },
        tooltip: { rtl: true, callbacks: { label: (c) => c.label + ': ' + Number(c.raw).toLocaleString('ar-SA', {maximumFractionDigits:0}) } }
      }
    }
  });
}

function renderCurrencySpendChart(data){
  const ctx = document.getElementById('chart-currency-spend');
  if (!ctx) return;
  const entries = Object.entries(data);
  chartInstances['currency-spend'] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: entries.map(e=>e[0]),
      datasets: [{ label: 'الإنفاق', data: entries.map(e=>e[1]), backgroundColor: CHART_COLORS.slice(0, entries.length), borderRadius: 6 }]
    },
    options: {
      responsive: true, maintainAspectRatio: true, indexAxis: 'y',
      plugins: { legend: { display: false }, tooltip: { rtl: true } },
      scales: { x: { ticks: { callback: v=>Number(v).toLocaleString('ar-SA',{notation:'compact'}) } } }
    }
  });
}

function renderPaymentStatusChart(data){
  const ctx = document.getElementById('chart-payment-status');
  if (!ctx) return;
  const labels = Object.keys(data);
  const colors = ['#ef4444','#f59e0b','#3b82f6','#16a34a'];
  chartInstances['payment-status'] = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data: Object.values(data), backgroundColor: colors, borderWidth: 2, borderColor: getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: { legend: { position: 'bottom', rtl: true, labels: { font: { family: 'Noto Sans Arabic', size: 11 }, padding: 12 } } }
    }
  });
}

function renderOrderTypeChart(domestic, international, other){
  const ctx = document.getElementById('chart-order-type');
  if (!ctx) return;
  chartInstances['order-type'] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['محلي','دولي','غير محدد'],
      datasets: [{ label: 'عدد الأوامر', data: [domestic, international, other], backgroundColor: ['#2563eb','#7c3aed','#9ca3af'], borderRadius: 6 }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
    }
  });
}

function exportToExcel(rows, filename){
  if (!rows || !rows.length) { toast('لا توجد بيانات للتصدير'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  XLSX.writeFile(wb, filename + '.xlsx');
}

function openModal(html, onMount){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay"><div class="modal">${html}</div></div>`;
  root.querySelector('.modal-overlay').addEventListener('click', (e)=>{ if(e.target.classList.contains('modal-overlay')) closeModal(); });
  if (onMount) onMount(root);
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function supplierOptions(selected){
  return cache.suppliers.map(s=>`<option value="${s.id}" ${s.id===selected?'selected':''}>${s.name}</option>`).join('');
}
function orderOptions(selected){
  return cache.orders.map(o=>`<option value="${o.id}" ${o.id===selected?'selected':''}>${o.po_number || '(بلا رقم)'} — ${supplierName(o.supplier_id)}</option>`).join('');
}

// نص موحّد للمطابقة: بدون تشكيل/نجمة/علامة استفهام، مسافات مفردة، أحرف صغيرة
function impNorm(v){
  return String(v ?? '').replace(/[ً-ْـ]/g,'').replace(/[*؟?]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
}
function impText(v){ const s = String(v ?? '').replace(/\s+/g,' ').trim(); return s || null; }
function impDigits(s){ return String(s).replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }
// يرجع {v} أو {err}
function impNum(v){
  if (v === null || v === undefined || v === '') return { v:null };
  if (typeof v === 'number') return isFinite(v) ? { v } : { err:true };
  const s = impDigits(v).replace(/[,،\s]/g,'').replace('٫','.');
  if (s === '') return { v:null };
  return /^-?\d+(\.\d+)?$/.test(s) ? { v:parseFloat(s) } : { err:true };
}
function impDate(v){
  if (v === null || v === undefined || v === '') return { v:null };
  const pad = n => String(n).padStart(2,'0');
  const ok = (y,m,d) => {
    const dt = new Date(Date.UTC(y, m-1, d));
    return (y>=2000 && y<=2100 && dt.getUTCFullYear()===y && dt.getUTCMonth()===m-1 && dt.getUTCDate()===d) ? { v:`${y}-${pad(m)}-${pad(d)}` } : { err:true };
  };
  if (typeof v === 'number') { // رقم تسلسلي من إكسل
    const p = XLSX.SSF.parse_date_code(v);
    return p ? ok(p.y, p.m, p.d) : { err:true };
  }
  if (v instanceof Date) return isNaN(v) ? { err:true } : ok(v.getFullYear(), v.getMonth()+1, v.getDate());
  const s = impDigits(v).trim();
  if (s === '') return { v:null };
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
  if (m) return ok(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/); // يوم/شهر/سنة
  if (m) return ok(+m[3], +m[2], +m[1]);
  return { err:true };
}
function impEnum(v, allowed){
  const n = impNorm(v);
  if (!n) return { v:null };
  const hit = allowed.find(a => impNorm(a) === n);
  return hit ? { v:hit } : { err:true };
}

// يحوّل ملف الإكسل إلى صفوف خام لكل شيت: [{_row, field:value...}]
function impReadWorkbook(wb){
  const out = {}, problems = [];
  for (const [key, def] of Object.entries(IMP_SHEETS)) {
    const sheetName = wb.SheetNames.find(n => impNorm(n) === impNorm(def.name));
    if (!sheetName) { out[key] = []; problems.push(`الشيت "${def.name}" غير موجود في الملف`); continue; }
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header:1, raw:true, defval:null, blankrows:true });
    const header = (aoa[0] || []).map(impNorm);
    const colMap = {};
    for (const [label, field] of Object.entries(def.cols)) {
      const idx = header.indexOf(impNorm(label));
      if (idx === -1) problems.push(`الشيت "${def.name}": العمود "${label}" غير موجود`);
      else colMap[field] = idx;
    }
    out[key] = [];
    for (let r = 1; r < aoa.length; r++) {
      const row = aoa[r] || [];
      const rec = { _row: r + 1 };
      let any = false;
      for (const [field, idx] of Object.entries(colMap)) {
        let cell = row[idx];
        if (typeof cell === 'string' && cell.trim() === '') cell = null;
        rec[field] = cell ?? null;
        if (cell !== null && cell !== undefined) any = true;
      }
      if (any) out[key].push(rec);
    }
  }
  return { rows: out, problems };
}

// يبني خطة الاستيراد (بدون أي كتابة على قاعدة البيانات)
function impBuildPlan(rows, db){
  const errors = [], warnings = [];
  const E = (sheet, row, msg) => errors.push(`${IMP_SHEETS[sheet].name} — صف ${row}: ${msg}`);
  const W = (sheet, row, msg) => warnings.push(`${IMP_SHEETS[sheet].name} — صف ${row}: ${msg}`);
  const key = impNorm;

  const supByKey = new Map();
  db.suppliers.forEach(s => { if (!supByKey.has(key(s.name))) supByKey.set(key(s.name), s); });
  const poByKey = new Map();
  db.orders.forEach(o => {
    if (!o.po_number) return;
    const k = key(o.po_number);
    if (poByKey.has(k)) warnings.push(`رقم الأمر "${o.po_number}" مكرر في النظام أكثر من مرة — سيتم الربط بأول سجل منه`);
    else poByKey.set(k, o);
  });

  const plan = { newSuppliers: new Map(), orders: [], lines: [], shipments: [], payments: [],
                 existingPoLinked: new Set(), skippedExisting: 0, skippedDuplicates: 0, skippedExamples: 0, errors, warnings };
  const needSupplier = (name) => { const k = key(name); if (!supByKey.has(k) && !plan.newSuppliers.has(k)) plan.newSuppliers.set(k, impText(name)); return k; };
  const newPoByKey = new Map();   // أوامر جديدة سليمة في الملف
  const warnedTotals = new Set();
  const badPoKeys = new Set();    // أوامر جديدة بها أخطاء
  const isExample = (r, checks) => key(r.po_number) === 'po-1070' && checks.every(([f, v]) => key(r[f]) === key(v));

  // ---- أوامر الشراء ----
  for (const r of rows.orders) {
    if (isExample(r, [['supplier','مصنع جيانغشي للتغليف']])) { plan.skippedExamples++; W('orders', r._row, 'صف المثال التوضيحي — تم تجاهله'); continue; }
    const before = errors.length;
    const poNum = impText(r.po_number);
    if (!poNum) { E('orders', r._row, 'رقم أمر الشراء مطلوب'); continue; }
    const k = key(poNum);
    if (poByKey.has(k)) { plan.skippedExisting++; continue; } // موجود مسبقًا — لا يُعدَّل
    if (newPoByKey.has(k) || badPoKeys.has(k)) { E('orders', r._row, `رقم الأمر "${poNum}" مكرر داخل الملف`); continue; }
    if (!impText(r.supplier)) E('orders', r._row, 'اسم المورد مطلوب');
    const ot = impEnum(r.order_type, ['محلي','دولي']); if (ot.err) E('orders', r._row, `نوع الأمر "${r.order_type}" غير صحيح (محلي/دولي)`);
    const cur = impEnum(r.currency, IMP_PO_CURRENCY); if (cur.err) E('orders', r._row, `العملة "${r.currency}" غير صحيحة (${IMP_PO_CURRENCY.join('/')})`);
    const st = impEnum(r.status, IMP_PO_STATUS); if (st.err) E('orders', r._row, `الحالة "${r.status}" غير صحيحة`);
    const od = impDate(r.order_date); if (od.err) E('orders', r._row, `تاريخ الأمر "${r.order_date}" غير صحيح (YYYY-MM-DD)`);
    const nd = impDate(r.need_by_date); if (nd.err) E('orders', r._row, `موعد الحاجة "${r.need_by_date}" غير صحيح (YYYY-MM-DD)`);
    const fx = impNum(r.exchange_rate); if (fx.err || (fx.v !== null && fx.v <= 0)) E('orders', r._row, `سعر الصرف "${r.exchange_rate}" غير صحيح`);
    const nama = impEnum(r.nama, ['نعم','لا']); if (nama.err) E('orders', r._row, `قيمة "رُفع على نما؟" يجب أن تكون نعم أو لا`);
    if (errors.length > before) { badPoKeys.add(k); continue; }
    if (!cur.v) W('orders', r._row, `العملة فارغة للأمر "${poNum}" — سيتم اعتماد SAR`);
    const o = { _key:k, po_number:poNum, _supKey:needSupplier(r.supplier), order_type:ot.v, currency:cur.v || 'SAR', status:st.v || 'مخطط',
                order_date:od.v, need_by_date:nd.v, exchange_rate_to_sar:fx.v, nama_uploaded:nama.v === 'نعم', notes:impText(r.notes), _lineTotal:0 };
    newPoByKey.set(k, o); plan.orders.push(o);
  }

  // يرجّع مرجع الأمر: {existing} أو {fresh} أو null (مع تسجيل الخطأ)
  const resolvePo = (sheet, r, required) => {
    const poNum = impText(r.po_number);
    if (!poNum) { if (required) E(sheet, r._row, 'رقم أمر الشراء مطلوب'); return null; }
    const k = key(poNum);
    if (poByKey.has(k)) return { existing: poByKey.get(k), k };
    if (newPoByKey.has(k)) return { fresh: newPoByKey.get(k), k };
    if (badPoKeys.has(k)) E(sheet, r._row, `أمر الشراء "${poNum}" به أخطاء في شيت "أوامر الشراء" — صحّحه أولاً`);
    else E(sheet, r._row, `أمر الشراء "${poNum}" غير موجود في النظام ولا في شيت "أوامر الشراء"`);
    return null;
  };

  // ---- بنود الأمر ----
  for (const r of rows.lines) {
    if (isExample(r, [['item_name','عبوة زجاج 50مل']])) { plan.skippedExamples++; W('lines', r._row, 'صف المثال التوضيحي — تم تجاهله'); continue; }
    const before = errors.length;
    const ref = resolvePo('lines', r, true);
    const name = impText(r.item_name); if (!name) E('lines', r._row, 'اسم الصنف مطلوب');
    const q = impNum(r.quantity); if (q.err || (q.v !== null && q.v < 0)) E('lines', r._row, `الكمية "${r.quantity}" غير صحيحة`);
    const p = impNum(r.unit_price); if (p.err || (p.v !== null && p.v < 0)) E('lines', r._row, `سعر الوحدة "${r.unit_price}" غير صحيح`);
    if (errors.length > before || !ref) continue;
    const qty = q.v ?? 0, price = p.v ?? 0;
    if (q.v === null || p.v === null) W('lines', r._row, `الكمية أو السعر فارغ للصنف "${name}" — سيُحفظ بصفر`);
    if (ref.existing) {
      const dup = db.lines.some(l => l.po_id === ref.existing.id && key(l.item_name) === key(name) && Number(l.quantity||0) === qty && Number(l.unit_price||0) === price);
      if (dup) { plan.skippedDuplicates++; W('lines', r._row, `البند "${name}" موجود مسبقًا بنفس الكمية والسعر في الأمر ${ref.existing.po_number} — تم تجاهله`); continue; }
      plan.existingPoLinked.add(ref.k);
      if (ref.existing.total_sar && !warnedTotals.has(ref.k)) { warnedTotals.add(ref.k); warnings.push(`الأمر ${ref.existing.po_number} موجود مسبقًا وله إجمالي بالريال محفوظ — إضافة بنود جديدة لن تحدّث الإجمالي تلقائيًا (يحتاج فتح الأمر وحفظه من حساب المدير)`); }
    } else ref.fresh._lineTotal += qty * price;
    plan.lines.push({ _poKey:ref.k, item_name:name, category:impText(r.category), quantity:qty, unit_price:price, notes:impText(r.notes),
                      currency: ref.existing ? ref.existing.currency : ref.fresh.currency });
  }

  // ---- الشحنات ----
  for (const r of rows.shipments) {
    if (isExample(r, [['container_number','MSCU1234567']])) { plan.skippedExamples++; W('shipments', r._row, 'صف المثال التوضيحي — تم تجاهله'); continue; }
    const before = errors.length;
    const ref = resolvePo('shipments', r, true);
    const rec = { container_number:impText(r.container_number), shipping_line:impText(r.shipping_line), container_contents:impText(r.container_contents),
                  tracking_url:impText(r.tracking_url), status:impText(r.status), notes:impText(r.notes) };
    const tq = impNum(r.total_quantity); if (tq.err) E('shipments', r._row, `الكمية الإجمالية "${r.total_quantity}" غير صحيحة`); rec.total_quantity = tq.v;
    for (const f of IMP_SHIP_DATES) { const d = impDate(r[f]); if (d.err) E('shipments', r._row, `تاريخ "${r[f]}" غير صحيح (YYYY-MM-DD)`); rec[f] = d.v; }
    if (rec.tracking_url && !/^https?:\/\//i.test(rec.tracking_url)) E('shipments', r._row, 'رابط التتبع يجب أن يبدأ بـ http:// أو https://');
    if (errors.length > before || !ref) continue;
    if (ref.existing) {
      if (rec.container_number && db.shipments.some(s => s.po_id === ref.existing.id && key(s.container_number) === key(rec.container_number))) {
        plan.skippedDuplicates++; W('shipments', r._row, `الحاوية ${rec.container_number} مسجلة مسبقًا على الأمر ${ref.existing.po_number} — تم تجاهلها`); continue;
      }
      plan.existingPoLinked.add(ref.k);
    }
    plan.shipments.push({ _poKey:ref.k, ...rec });
  }

  // ---- الدفعات ----
  for (const r of rows.payments) {
    if (isExample(r, [['reference','TT-2026-114']])) { plan.skippedExamples++; W('payments', r._row, 'صف المثال التوضيحي — تم تجاهله'); continue; }
    const before = errors.length;
    const ref = resolvePo('payments', r, false);
    const supName = impText(r.supplier);
    if (!impText(r.po_number) && !supName) E('payments', r._row, 'يجب تحديد رقم أمر الشراء أو اسم المورد على الأقل');
    const amt = impNum(r.amount); if (amt.err || amt.v === null || amt.v <= 0) E('payments', r._row, `المبلغ "${r.amount ?? ''}" مطلوب ويجب أن يكون رقمًا أكبر من صفر`);
    const seq = impNum(r.payment_seq); if (seq.err || (seq.v !== null && (!Number.isInteger(seq.v) || seq.v < 1))) E('payments', r._row, `رقم الدفعة "${r.payment_seq}" غير صحيح`);
    const st = impEnum(r.status, IMP_PAY_STATUS); if (st.err) E('payments', r._row, `الحالة "${r.status}" غير صحيحة`);
    const dd = impDate(r.due_date); if (dd.err) E('payments', r._row, `تاريخ الاستحقاق "${r.due_date}" غير صحيح (YYYY-MM-DD)`);
    const td = impDate(r.transferred_date); if (td.err) E('payments', r._row, `تاريخ التحويل "${r.transferred_date}" غير صحيح (YYYY-MM-DD)`);
    const q = impNum(r.quantity); if (q.err) E('payments', r._row, `الكمية "${r.quantity}" غير صحيحة`);
    let cur = impEnum(r.currency, IMP_PAY_CURRENCY);
    if (cur.err) E('payments', r._row, `العملة "${r.currency}" غير صحيحة (${IMP_PAY_CURRENCY.join('/')})`);
    else if (!cur.v) {
      const poCur = ref ? (ref.existing ? ref.existing.currency : ref.fresh.currency) : null;
      if (IMP_PAY_CURRENCY.includes(poCur)) cur = { v: poCur };
      else E('payments', r._row, 'العملة مطلوبة');
    }
    if (errors.length > before || (impText(r.po_number) && !ref)) continue;
    const seqV = seq.v ?? 1;
    if (ref && ref.existing && db.payments.some(p => p.po_id === ref.existing.id && Number(p.payment_seq) === seqV && Number(p.amount) === amt.v)) {
      plan.skippedDuplicates++; W('payments', r._row, `الدفعة رقم ${seqV} بمبلغ ${amt.v} مسجلة مسبقًا على الأمر ${ref.existing.po_number} — تم تجاهلها`); continue;
    }
    if (!ref && supName && supByKey.has(key(supName)) && db.payments.some(p => !p.po_id && p.supplier_id === supByKey.get(key(supName)).id && Number(p.payment_seq) === seqV && Number(p.amount) === amt.v)) {
      plan.skippedDuplicates++; W('payments', r._row, `الدفعة رقم ${seqV} بمبلغ ${amt.v} مسجلة مسبقًا للمورد ${supName} — تم تجاهلها`); continue;
    }
    if (ref && ref.existing) plan.existingPoLinked.add(ref.k);
    if (st.v === 'مُحوَّلة' && !td.v) W('payments', r._row, 'الحالة "مُحوَّلة" بدون تاريخ تحويل');
    plan.payments.push({ _poKey: ref ? ref.k : null, _supKey: supName ? needSupplier(supName) : null,
      payment_seq:seqV, amount:amt.v, currency:cur.v, due_date:dd.v, status:st.v || 'مستحقة', transferred_date:td.v,
      reference:impText(r.reference), item_name:impText(r.item_name), category:impText(r.category), quantity:q.v, notes:impText(r.notes) });
  }

  plan.orders.forEach(o => { if (!plan.lines.some(l => l._poKey === o._key)) warnings.push(`الأمر الجديد ${o.po_number} بدون أي بنود في شيت "بنود الأمر"`); });
  plan.total = plan.orders.length + plan.lines.length + plan.shipments.length + plan.payments.length;
  return plan;
}

// ينفّذ الخطة على قاعدة البيانات بالترتيب: موردون ← أوامر ← بنود ← شحنات ← دفعات
async function impExecute(plan, client, userId, db){
  const done = { suppliers:0, orders:0, lines:0, shipments:0, payments:0 };
  const fail = (step, error) => { const e = new Error(`${step}: ${error.message}`); e.done = done; return e; };
  const supId = new Map(); db.suppliers.forEach(s => { const k = impNorm(s.name); if (!supId.has(k)) supId.set(k, s.id); });
  const poId = new Map(); db.orders.forEach(o => { if (o.po_number) { const k = impNorm(o.po_number); if (!poId.has(k)) poId.set(k, { id:o.id, supplier_id:o.supplier_id }); } });

  if (plan.newSuppliers.size) {
    const { data, error } = await client.from('erp_suppliers').insert([...plan.newSuppliers.values()].map(name => ({ name, created_by:userId }))).select();
    if (error) throw fail('إنشاء الموردين', error);
    data.forEach(s => supId.set(impNorm(s.name), s.id)); done.suppliers = data.length;
  }
  if (plan.orders.length) {
    const now = new Date().toISOString();
    const { data, error } = await client.from('erp_purchase_orders').insert(plan.orders.map(o => ({
      po_number:o.po_number, supplier_id:supId.get(o._supKey), order_type:o.order_type, currency:o.currency, status:o.status,
      order_date:o.order_date, need_by_date:o.need_by_date, notes:o.notes, exchange_rate_to_sar:o.exchange_rate_to_sar,
      total_sar: o.exchange_rate_to_sar && o._lineTotal ? Math.round(o._lineTotal * o.exchange_rate_to_sar * 100) / 100 : null,
      nama_uploaded:o.nama_uploaded, nama_uploaded_at:o.nama_uploaded ? now : null, created_by:userId,
    }))).select();
    if (error) throw fail('إنشاء أوامر الشراء', error);
    data.forEach(o => poId.set(impNorm(o.po_number), { id:o.id, supplier_id:o.supplier_id })); done.orders = data.length;
  }
  if (plan.lines.length) {
    const { error } = await client.from('erp_po_line_items').insert(plan.lines.map(l => ({
      po_id:poId.get(l._poKey).id, item_name:l.item_name, category:l.category, unit_price:l.unit_price, quantity:l.quantity,
      currency:l.currency, notes:l.notes, created_by:userId })));
    if (error) throw fail('إضافة البنود', error);
    done.lines = plan.lines.length;
  }
  if (plan.shipments.length) {
    const { error } = await client.from('erp_shipments').insert(plan.shipments.map(({ _poKey, ...s }) => ({ ...s, po_id:poId.get(_poKey).id, created_by:userId, updated_by:userId })));
    if (error) throw fail('إضافة الشحنات', error);
    done.shipments = plan.shipments.length;
  }
  if (plan.payments.length) {
    const { error } = await client.from('erp_payments').insert(plan.payments.map(({ _poKey, _supKey, ...p }) => {
      const po = _poKey ? poId.get(_poKey) : null;
      return { ...p, po_id: po ? po.id : null, supplier_id: _supKey ? supId.get(_supKey) : (po ? po.supplier_id : null), created_by:userId };
    }));
    if (error) throw fail('إضافة الدفعات', error);
    done.payments = plan.payments.length;
  }
  return done;
}

function impEsc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

      <a href="import-template.xlsx" download>⬇️ تحميل القالب</a></p>

            <strong>ملخص ما سيتم إضافته</strong>
            <table style="margin-top:6px"><tbody>
              <tr><td>موردون جدد</td><td><strong>${p.newSuppliers.size}</strong> ${p.newSuppliers.size ? '— ' + impEsc([...p.newSuppliers.values()].join('، ')) : ''}</td></tr>
              <tr><td>أوامر شراء جديدة</td><td><strong>${newPoCount}</strong></td></tr>
              <tr><td>أوامر موجودة مسبقًا (ربط فقط، بدون تعديل)</td><td><strong>${p.skippedExisting}</strong></td></tr>
              <tr><td>بنود</td><td><strong>${p.lines.length}</strong></td></tr>
              <tr><td>شحنات</td><td><strong>${p.shipments.length}</strong></td></tr>
              <tr><td>دفعات</td><td><strong>${p.payments.length}</strong></td></tr>
              <tr><td>صفوف مكررة تم تجاهلها</td><td><strong>${p.skippedDuplicates}</strong></td></tr>
            </tbody></table>
            ${p.newSuppliers.size ? '<p class="muted" style="margin-top:6px">⚠️ راجع أسماء الموردين الجدد: لو أحدهم موجود في النظام باسم مختلف قليلاً، صحّح الاسم في الملف لتفادي التكرار.</p>' : ''}
          </div>
          ${p.errors.length ? `<div class="card" style="margin-top:10px;border-color:var(--danger)"><strong style="color:var(--danger)">أخطاء (${p.errors.length}) — لن يتم الاستيراد قبل تصحيحها وإعادة رفع الملف</strong>${list(p.errors,'var(--danger)')}</div>` : ''}
          ${p.warnings.length ? `<div class="card" style="margin-top:10px;border-color:var(--warn)"><strong>تنبيهات (${p.warnings.length})</strong>${list(p.warnings,'inherit')}</div>` : ''}
          ${!p.errors.length && !p.total ? '<p class="muted">لا توجد صفوف جديدة للاستيراد.</p>' : ''}`;
        if (!p.errors.length && p.total) { plan = p; runBtn.disabled = false; }
      } catch(err) { preview.innerHTML = `<p style="color:var(--danger)">تعذّرت قراءة الملف: ${impEsc(err.message)}</p>`; }
    };
    runBtn.onclick = async () => {
      if (!plan) return;
      if (!confirm(`سيتم إضافة ${plan.orders.length} أمر، ${plan.lines.length} بند، ${plan.shipments.length} شحنة، ${plan.payments.length} دفعة. متابعة؟`)) return;
      runBtn.disabled = true; runBtn.textContent = 'جارٍ الاستيراد...';
      const p = plan; plan = null;
      try {
        const d = await impExecute(p, sb, currentUser.id, cache);
        await refreshAll(); renderActiveTab(); closeModal();
        toast(`تم الاستيراد: ${d.orders} أمر، ${d.lines} بند، ${d.shipments} شحنة، ${d.payments} دفعة`);
      } catch(err) {
        const d = err.done || {};
        await refreshAll(); renderActiveTab();
        preview.innerHTML = `<div class="card" style="border-color:var(--danger)"><strong style="color:var(--danger)">توقف الاستيراد — ${impEsc(err.message)}</strong>
          <p style="font-size:13px">ما تم حفظه قبل التوقف: ${d.suppliers||0} مورد، ${d.orders||0} أمر، ${d.lines||0} بند، ${d.shipments||0} شحنة، ${d.payments||0} دفعة.
          بعد معالجة السبب أعد رفع نفس الملف: الأوامر والصفوف المحفوظة سيتم تجاهلها تلقائيًا ولن تتكرر.</p></div>`;
        runBtn.textContent = 'تأكيد الاستيراد';
      }
    };
  });
}

// ORDERS — Enhanced with FX, Nama Soft, Attachments
// ============================================================
function renderOrders(root){
  const canAdd = canWrite();
  const fullAccess = canFullAccess();
  // Drop any stale selections (orders no longer in the current list)
  const liveIds = new Set(cache.orders.map(o=>o.id));
  [...selectedOrderIds].forEach(id=>{ if(!liveIds.has(id)) selectedOrderIds.delete(id); });

  root.innerHTML = `
    <div class="card">
      <div class="toolbar">
        <strong>أوامر الشراء (${cache.orders.length})</strong>
        <div class="row" style="flex:0;gap:8px">
          <button class="btn small" id="exp-orders">تصدير إكسل</button>
          ${canAdd ? '<button class="btn small" id="imp-orders">⬆️ استيراد إكسل</button>' : ''}
          ${canAdd ? '<button class="btn primary small" id="add-order">+ أمر جديد</button>' : ''}
        </div>
      </div>
      ${fullAccess ? `
      <div class="toolbar" id="bulk-toolbar" style="background:var(--warn-light);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-top:8px">
        <span style="font-size:13px">🔐 صلاحية Full Access — <strong id="bulk-count">${selectedOrderIds.size}</strong> محدد من ${cache.orders.length}</span>
        <div class="row" style="flex:0;gap:8px">
          <button class="btn small danger" id="bulk-del-selected" ${selectedOrderIds.size?'':'disabled'}>حذف المحدد</button>
          <button class="btn small danger" id="bulk-del-all">حذف الكل (${cache.orders.length})</button>
        </div>
      </div>` : ''}
      <div style="overflow:auto;max-height:60vh">
      <table>
        <thead><tr>
          ${fullAccess ? `<th><input type="checkbox" id="select-all-orders" ${cache.orders.length && selectedOrderIds.size===cache.orders.length?'checked':''}></th>` : ''}
          <th>رقم الأمر</th><th>المورد</th><th>النوع</th><th>العملة</th><th>سعر الصرف</th><th>الإجمالي (ر.س)</th>
          <th>الحالة</th><th>نما سوفت</th><th>تاريخ الأمر</th><th>بنود</th><th></th>
        </tr></thead>
        <tbody>
          ${cache.orders.map(o=>{
            const lines = linesFor(o.id);
            const lineTotal = lines.reduce((s,l)=>s+(l.line_total||l.unit_price*l.quantity||0),0);
            const sarTotal = o.total_sar || (o.exchange_rate_to_sar ? lineTotal * o.exchange_rate_to_sar : null);
            return `<tr>
              ${fullAccess ? `<td><input type="checkbox" class="order-check" data-id="${o.id}" ${selectedOrderIds.has(o.id)?'checked':''}></td>` : ''}
              <td>${o.po_number || '—'}</td>
              <td>${supplierName(o.supplier_id)}</td>
              <td>${o.order_type||'—'}</td>
              <td>${o.currency}</td>
              <td>${o.exchange_rate_to_sar ? fmtNum(o.exchange_rate_to_sar) : '—'}</td>
              <td>${sarTotal ? fmtNum(sarTotal) : '—'}</td>
              <td><span class="badge ${o.status==='مُستلم'?'ok':o.status==='مُلغى'?'bad':'info'}">${o.status}</span></td>
              <td>${o.nama_uploaded ? '<span class="badge ok">✓</span>' : '<span class="badge bad">✗</span>'}</td>
              <td>${fmtDate(o.order_date)}</td>
              <td>${lines.length}</td>
              <td><button class="btn small" data-id="${o.id}" data-act="edit-order">${canEditExisting()?'تعديل':'عرض'}</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
  if (canAdd) root.querySelector('#imp-orders').onclick = openImportModal;
  root.querySelector('#exp-orders').onclick = () => exportToExcel(cache.orders.map(o=>{
    const lines = linesFor(o.id);
    const lineTotal = lines.reduce((s,l)=>s+(l.line_total||l.unit_price*l.quantity||0),0);
    return {
      رقم_الأمر:o.po_number, المورد:supplierName(o.supplier_id), النوع:o.order_type, العملة:o.currency,
      سعر_الصرف:o.exchange_rate_to_sar, الإجمالي_بالعملة:lineTotal, الإجمالي_بالريال:o.total_sar,
      الحالة:o.status, نما_سوفت:o.nama_uploaded?'نعم':'لا', تاريخ_الأمر:o.order_date, موعد_الحاجة:o.need_by_date, ملاحظات:o.notes
    };
  }), 'purchase_orders');
  if (canAdd) root.querySelector('#add-order').onclick = () => openOrderModal(null);
  root.querySelectorAll('[data-act="edit-order"]').forEach(b=>{
    b.onclick = () => openOrderModal(cache.orders.find(o=>o.id===b.dataset.id));
  });

  if (fullAccess) {
    const bulkCount = () => root.querySelector('#bulk-count') && (root.querySelector('#bulk-count').textContent = selectedOrderIds.size);
    const bulkDelBtn = () => root.querySelector('#bulk-del-selected');
    root.querySelector('#select-all-orders').onchange = (e) => {
      if (e.target.checked) cache.orders.forEach(o=>selectedOrderIds.add(o.id));
      else selectedOrderIds.clear();
      renderOrders(root);
    };
    root.querySelectorAll('.order-check').forEach(cb=>{
      cb.onchange = () => {
        if (cb.checked) selectedOrderIds.add(cb.dataset.id); else selectedOrderIds.delete(cb.dataset.id);
        bulkCount();
        if (bulkDelBtn()) bulkDelBtn().disabled = selectedOrderIds.size === 0;
        const selAll = root.querySelector('#select-all-orders');
        if (selAll) selAll.checked = selectedOrderIds.size === cache.orders.length && cache.orders.length > 0;
      };
    });
    root.querySelector('#bulk-del-selected').onclick = async () => {
      const ids = [...selectedOrderIds];
      if (!ids.length) return;
      if (!confirm(`حذف ${ids.length} أمر شراء محدد وكل بنودهم؟ لا يمكن التراجع.`)) return;
      const { error } = await sb.from('erp_purchase_orders').delete().in('id', ids);
      if (error) { toast('خطأ: '+error.message); return; }
      selectedOrderIds.clear();
      toast(`تم حذف ${ids.length} أمر شراء`); await refreshAll(); renderActiveTab();
    };
    root.querySelector('#bulk-del-all').onclick = async () => {
      const ids = cache.orders.map(o=>o.id);
      if (!ids.length) return;
      if (!confirm(`حذف جميع أوامر الشراء (${ids.length}) وكل بنودها؟ هذا إجراء نهائي لا يمكن التراجع عنه.`)) return;
      if (!confirm('تأكيد أخير: سيتم حذف كل أوامر الشراء المعروضة الآن. متابعة؟')) return;
      const { error } = await sb.from('erp_purchase_orders').delete().in('id', ids);
      if (error) { toast('خطأ: '+error.message); return; }
      selectedOrderIds.clear();
      toast(`تم حذف ${ids.length} أمر شراء`); await refreshAll(); renderActiveTab();
    };
  }
}

function openOrderModal(order){
  const isEdit = !!order;
  const editable = !isEdit ? canWrite() : canEditExisting();
  const attachments = isEdit ? attachmentsFor('po', order.id) : [];

  openModal(`
    <h3>${isEdit?'تعديل أمر شراء':'أمر شراء جديد'}</h3>
    <div class="row">
      <div class="field"><label>رقم الأمر</label><input id="f-po_number" value="${order?.po_number||''}" ${editable?'':'disabled'}></div>
      <div class="field"><label>المورد</label><select id="f-supplier_id" ${editable?'':'disabled'}><option value="">—</option>${supplierOptions(order?.supplier_id)}</select></div>
    </div>
    <div class="row">
      <div class="field"><label>نوع الطلب</label><select id="f-order_type" ${editable?'':'disabled'}>
        <option value="">—</option><option value="محلي" ${order?.order_type==='محلي'?'selected':''}>محلي</option><option value="دولي" ${order?.order_type==='دولي'?'selected':''}>دولي</option>
      </select></div>
      <div class="field"><label>العملة</label><select id="f-currency" ${editable?'':'disabled'}>
        ${['SAR','USD','EUR','CNY'].map(c=>`<option value="${c}" ${order?.currency===c?'selected':''}>${c}</option>`).join('')}
      </select></div>
    </div>
    <div class="row">
      <div class="field"><label>سعر الصرف للريال</label><input type="number" step="0.000001" id="f-exchange_rate" value="${order?.exchange_rate_to_sar||''}" ${editable?'':'disabled'} placeholder="مثال: 3.75"></div>
      <div class="field"><label>الإجمالي بالريال (محسوب)</label><input id="f-total_sar" value="${order?.total_sar ? fmtNum(order.total_sar) : '—'}" disabled style="background:var(--bg);font-weight:600"></div>
    </div>
    <div class="row">
      <div class="field"><label>الحالة</label><select id="f-status" ${editable?'':'disabled'}>
        ${['مخطط','مؤكد','قيد الإنتاج','شُحن','وصل','مُستلم','مُلغى'].map(s=>`<option value="${s}" ${order?.status===s?'selected':''}>${s}</option>`).join('')}
      </select></div>
      <div class="field"><label>تاريخ الأمر</label><input type="date" id="f-order_date" value="${order?.order_date||''}" ${editable?'':'disabled'}></div>
    </div>
    <div class="row">
      <div class="field"><label>موعد الحاجة</label><input type="date" id="f-need_by_date" value="${order?.need_by_date||''}" ${editable?'':'disabled'}></div>
    </div>

    <!-- Nama Soft Upload Status -->
    <div style="margin:10px 0">
      <label class="nama-toggle ${order?.nama_uploaded?'uploaded':''}">
        <input type="checkbox" id="f-nama_uploaded" ${order?.nama_uploaded?'checked':''} ${editable?'':'disabled'}>
        <span>تم الرفع على نما سوفت</span>
        ${order?.nama_uploaded_at ? `<span class="muted" style="margin-right:8px">(${fmtDate(order.nama_uploaded_at)})</span>` : ''}
      </label>
    </div>

    <div class="field"><label>ملاحظات</label><textarea id="f-notes" ${editable?'':'disabled'}>${order?.notes||''}</textarea></div>

    ${isEdit ? renderLineItemsBlock(order) : `
    <div class="card" style="margin-top:10px">
      <div class="toolbar"><strong>بنود الأمر</strong><button type="button" class="btn small" id="new-add-line">+ بند آخر</button></div>
      <table>
        <thead><tr><th>اسم الصنف</th><th>الفئة</th><th>سعر الوحدة (المبلغ)</th><th>الكمية</th><th></th></tr></thead>
        <tbody id="new-lines-body">
          <tr class="new-line-row">
            <td><input class="nl-name" placeholder="مثال: زجاجة"></td>
            <td><input class="nl-category" placeholder="مثال: عبوات، مواد خام"></td>
            <td><input type="number" step="0.0001" class="nl-price"></td>
            <td><input type="number" step="0.01" class="nl-qty"></td>
            <td></td>
          </tr>
        </tbody>
      </table>
      <p class="muted" style="margin-top:6px">أضف كل أصناف هذا الأمر هنا (زجاج، غطاء، مضخة...) بدل إنشاء أمر شراء منفصل لكل صنف.</p>
    </div>`}

    ${isEdit ? renderAttachmentsBlock('po', order.id, attachments) : '<p class="muted" style="margin-top:8px">📎 اضغط "حفظ" أولاً — ستفتح النافذة تلقائيًا لإرفاق الملفات.</p>'}

    <div class="row" style="margin-top:14px">
      ${editable ? `<button class="btn primary" id="save-order">حفظ</button>` : ''}
      <button class="btn" id="cancel-order">إغلاق</button>
      ${isEdit && canFullAccess() ? `<button class="btn danger" id="del-order">حذف</button>` : ''}
    </div>
  `, (root)=>{
    // Auto-calculate total SAR when exchange rate or item rows change
    const rateInput = root.querySelector('#f-exchange_rate');
    const sarDisplay = root.querySelector('#f-total_sar');
    const computeLineTotal = () => {
      if (isEdit) {
        const lines = linesFor(order.id);
        return lines.reduce((s,l)=>s+(l.line_total||l.unit_price*l.quantity||0),0);
      }
      return [...root.querySelectorAll('.new-line-row')].reduce((s,tr)=>{
        const price = parseFloat(tr.querySelector('.nl-price').value)||0;
        const qty = parseFloat(tr.querySelector('.nl-qty').value)||0;
        return s + price*qty;
      },0);
    };
    const updateSar = () => {
      const rate = parseFloat(rateInput.value) || 0;
      const lineTotal = computeLineTotal();
      sarDisplay.value = (rate > 0 && lineTotal > 0) ? fmtNum(lineTotal * rate) : '—';
    };
    rateInput.addEventListener('input', updateSar);
    if (!isEdit) {
      const linesBody = root.querySelector('#new-lines-body');
      linesBody.addEventListener('input', updateSar);
      root.querySelector('#new-add-line').onclick = () => {
        const tr = document.createElement('tr');
        tr.className = 'new-line-row';
        tr.innerHTML = `
          <td><input class="nl-name" placeholder="مثال: غطاء"></td>
          <td><input class="nl-category" placeholder="مثال: عبوات"></td>
          <td><input type="number" step="0.0001" class="nl-price"></td>
          <td><input type="number" step="0.01" class="nl-qty"></td>
          <td><button type="button" class="btn small danger nl-del">حذف</button></td>`;
        linesBody.appendChild(tr);
        tr.querySelector('.nl-del').onclick = () => { tr.remove(); updateSar(); };
      };
      updateSar();
    }

    // Nama toggle visual
    const namaCheckbox = root.querySelector('#f-nama_uploaded');
    namaCheckbox.addEventListener('change', () => {
      namaCheckbox.closest('.nama-toggle').classList.toggle('uploaded', namaCheckbox.checked);
    });

    root.querySelector('#cancel-order').onclick = closeModal;
    if (editable) root.querySelector('#save-order').onclick = async () => {
      const lineTotal = computeLineTotal();
      const rate = parseFloat(val('f-exchange_rate')) || null;

      // New order only: collect every item row the user added
      const newLineRows = !isEdit ? [...root.querySelectorAll('.new-line-row')].map(tr => ({
        item_name: tr.querySelector('.nl-name').value.trim(),
        category: tr.querySelector('.nl-category').value || null,
        unit_price: parseFloat(tr.querySelector('.nl-price').value) || 0,
        quantity: parseFloat(tr.querySelector('.nl-qty').value) || 0,
      })).filter(r => r.item_name) : [];

      const payload = {
        po_number: val('f-po_number') || null,
        supplier_id: val('f-supplier_id') || null,
        order_type: val('f-order_type') || null,
        currency: val('f-currency'),
        status: val('f-status'),
        order_date: val('f-order_date') || null,
        need_by_date: val('f-need_by_date') || null,
        notes: val('f-notes') || null,
        exchange_rate_to_sar: rate,
        total_sar: rate && lineTotal ? Math.round(lineTotal * rate * 100) / 100 : null,
        nama_uploaded: namaCheckbox.checked,
        nama_uploaded_at: namaCheckbox.checked && !order?.nama_uploaded ? new Date().toISOString() : (order?.nama_uploaded_at || null),
      };
      try {
        if (isEdit) {
          const { error } = await sb.from('erp_purchase_orders').update(payload).eq('id', order.id);
          if (error) throw error;
          toast('تم الحفظ'); closeModal(); await refreshAll(); renderActiveTab();
        } else {
          payload.created_by = currentUser.id;
          const { data: newOrder, error } = await sb.from('erp_purchase_orders').insert(payload).select().single();
          if (error) throw error;
          if (newLineRows.length) {
            const { error: lineErr } = await sb.from('erp_po_line_items').insert(
              newLineRows.map(r => ({
                po_id: newOrder.id, item_name: r.item_name, category: r.category,
                unit_price: r.unit_price, quantity: r.quantity, currency: payload.currency,
                created_by: currentUser.id,
              }))
            );
            if (lineErr) toast('تم حفظ الأمر، لكن حدث خطأ في حفظ البنود: ' + lineErr.message);
          }
          await refreshAll(); renderActiveTab();
          toast('تم الحفظ — يمكنك الآن إرفاق ملف');
          openOrderModal(cache.orders.find(o=>o.id===newOrder.id));
        }
      } catch(e){ toast('خطأ: ' + e.message); }
    };
    if (isEdit && canFullAccess()) root.querySelector('#del-order').onclick = async () => {
      if (!confirm('حذف هذا الأمر وكل بنوده؟')) return;
      const { error } = await sb.from('erp_purchase_orders').delete().eq('id', order.id);
      if (error) { toast('خطأ: '+error.message); return; }
      toast('تم الحذف'); closeModal(); await refreshAll(); renderActiveTab();
    };
    wireLineItemsBlock(root, order);
    if (isEdit) wireAttachmentsBlock(root, 'po', order.id, () => openOrderModal(cache.orders.find(o=>o.id===order.id)));
  });
}

// ============================================================
// LINE ITEMS — Enhanced with Category
// ============================================================
function renderLineItemsBlock(order){
  const lines = linesFor(order.id);
  return `
    <div class="card" style="margin-top:10px">
      <div class="toolbar"><strong>بنود الأمر</strong>${canWrite()?'<button class="btn small" id="add-line">+ بند</button>':''}</div>
      <table>
        <thead><tr><th>الصنف</th><th>الفئة</th><th>سعر الوحدة</th><th>الكمية</th><th>الإجمالي</th><th></th></tr></thead>
        <tbody id="lines-body">
        ${lines.map(l=>`
          <tr>
            <td>${l.item_name}</td><td>${l.category||'—'}</td><td>${fmtNum(l.unit_price)}</td><td>${fmtNum(l.quantity)}</td><td>${fmtNum(l.line_total)}</td>
            <td>${canDelete()?`<button class="btn small" data-lid="${l.id}" data-act="del-line">حذف</button>`:''}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function wireLineItemsBlock(root, order){
  if (!order) return;
  const addBtn = root.querySelector('#add-line');
  if (addBtn) addBtn.onclick = () => {
    openModal(`
      <h3>بند جديد</h3>
      <div class="field"><label>اسم الصنف</label><input id="l-item_name"></div>
      <div class="row">
        <div class="field"><label>الفئة</label><input id="l-category" placeholder="مثال: عبوات، مواد خام، كراتين"></div>
      </div>
      <div class="row">
        <div class="field"><label>سعر الوحدة</label><input type="number" step="0.0001" id="l-unit_price"></div>
        <div class="field"><label>الكمية</label><input type="number" step="0.01" id="l-quantity"></div>
      </div>
      <div class="field"><label>العملة</label><input id="l-currency" value="${order.currency}"></div>
      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="save-line">حفظ البند</button>
        <button class="btn" id="back-line">رجوع</button>
      </div>
    `, (r2)=>{
      r2.querySelector('#back-line').onclick = () => openOrderModal(order);
      r2.querySelector('#save-line').onclick = async () => {
        const payload = {
          po_id: order.id, item_name: val('l-item_name'),
          unit_price: parseFloat(val('l-unit_price'))||0, quantity: parseFloat(val('l-quantity'))||0,
          currency: val('l-currency'), category: val('l-category')||null, created_by: currentUser.id,
        };

function wireAttachmentsBlock(root, entityType, entityId, onRefresh){
  // عرض مرفق — الحاوية خاصة (bucket: public=false)، لذا نستخدم رابط موقّع بدل رابط عام
  root.querySelectorAll('[data-act="view-attach"]').forEach(b=>{
    b.onclick = async () => {
      const att = cache.attachments.find(a=>a.id===b.dataset.aid);
      if (!att?.file_path) { toast('لا يمكن إيجاد مسار الملف'); return; }
      const { data, error } = await sb.storage.from('erp-attachments').createSignedUrl(att.file_path, 120);
      if (error) { toast('خطأ: '+error.message); return; }
      window.open(data.signedUrl, '_blank');
    };
  });

  root.querySelectorAll('[data-act="del-attach"]').forEach(b=>{
    b.onclick = async () => {
      if (!confirm('حذف هذا المرفق؟')) return;
      const att = cache.attachments.find(a=>a.id===b.dataset.aid);
      if (att?.file_path) {
        await sb.storage.from('erp-attachments').remove([att.file_path]);
      }
      const { error } = await sb.from('erp_attachments').delete().eq('id', b.dataset.aid);
      if (error) { toast('خطأ: '+error.message); return; }
      await refreshAll();
      onRefresh();
    };
  });

  const dropArea = root.querySelector('#attach-drop');
  const fileInput = root.querySelector('#attach-input');
  if (!dropArea || !fileInput) return;

  ['dragenter','dragover'].forEach(e=>dropArea.addEventListener(e, (ev)=>{ ev.preventDefault(); dropArea.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(e=>dropArea.addEventListener(e, (ev)=>{ ev.preventDefault(); dropArea.classList.remove('dragover'); }));

  dropArea.addEventListener('drop', (ev) => handleFiles(ev.dataTransfer.files, entityType, entityId, onRefresh));
  fileInput.addEventListener('change', () => handleFiles(fileInput.files, entityType, entityId, onRefresh));
}

async function handleFiles(files, entityType, entityId, onRefresh){
  const statusEl = document.getElementById('attach-status');
  for (const file of files) {
    if (statusEl) statusEl.textContent = `جارٍ رفع ${file.name}...`;
    const path = `${entityType}/${entityId}/${Date.now()}_${file.name}`;
    const { error: uploadError } = await sb.storage.from('erp-attachments').upload(path, file);
    if (uploadError) { toast('خطأ في الرفع: ' + uploadError.message); continue; }
    const { error: dbError } = await sb.from('erp_attachments').insert({
      entity_type: entityType, entity_id: entityId, file_name: file.name, file_type: file.type,
      file_size: file.size, file_path: path, uploaded_by: currentUser.id,
    });
    if (dbError) { toast('خطأ في التسجيل: ' + dbError.message); continue; }
  }
  if (statusEl) statusEl.textContent = 'تم الرفع بنجاح ✓';
  await refreshAll();
  onRefresh();
}
