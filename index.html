// AGING REPORT — SLA / delivery duration per purchase order
// ============================================================
function renderAging(root){
  const msDay = 1000*60*60*24;
  const nowMs = Date.now();
  const rows = cache.orders.map(o=>{
    const ships = shipmentsFor(o.id);
    const receivedDates = ships.map(s=>s.received_date).filter(Boolean);
    const receivedDate = receivedDates.length ? receivedDates.sort().slice(-1)[0] : null;
    const isClosed = o.status==='مُستلم' || !!receivedDate;
    let ageDays = null;
    if (o.order_date) {
      const endMs = receivedDate ? new Date(receivedDate).getTime() : nowMs;
      ageDays = Math.floor((endMs - new Date(o.order_date).getTime())/msDay);
    }
    let sla = '—', slaClass = '';
    if (ageDays != null) {
      if (ageDays <= 30) { sla = 'سريع'; slaClass='ok'; }
      else if (ageDays <= 60) { sla = 'ضمن المعتاد'; slaClass='info'; }
      else { sla = isClosed ? 'متأخر' : 'مفتوح ومتأخر'; slaClass='bad'; }
    }
    return { o, receivedDate, isClosed, ageDays, sla, slaClass };
  }).filter(r=>r.ageDays!=null).sort((a,b)=>b.ageDays-a.ageDays);

  const closedRows = rows.filter(r=>r.isClosed);
  const avgClosedAge = closedRows.length ? Math.round(closedRows.reduce((s,r)=>s+r.ageDays,0)/closedRows.length) : 0;
  const delayedOpen = rows.filter(r=>!r.isClosed && r.ageDays>60).length;
  const oldestOpen = rows.filter(r=>!r.isClosed).sort((a,b)=>b.ageDays-a.ageDays)[0];

  root.innerHTML = `
    <div class="kpi-grid" style="margin-bottom:14px">
      <div class="kpi-card green"><div class="kpi-icon">📊</div><div class="kpi-value">${avgClosedAge}</div><div class="kpi-label">متوسط مدة التوريد للأوامر المستلمة (يوم)</div></div>
      <div class="kpi-card ${delayedOpen>0?'red':'green'}"><div class="kpi-icon">🚨</div><div class="kpi-value">${delayedOpen}</div><div class="kpi-label">أوامر مفتوحة ومتأخرة (أكثر من 60 يوم)</div></div>
      <div class="kpi-card amber"><div class="kpi-icon">⌛</div><div class="kpi-value">${oldestOpen?oldestOpen.ageDays:0}</div><div class="kpi-label">أقدم أمر مفتوح (يوم)${oldestOpen?' — '+(oldestOpen.o.po_number||''):''}</div></div>
    </div>
    <div class="card">
      <div class="toolbar">
        <strong>تقرير تقادم أوامر الشراء (${rows.length})</strong>
        <button class="btn small" id="exp-aging">تصدير إكسل</button>
      </div>
      <p class="muted" style="margin-bottom:8px">تصنيف تقريبي (محسوب): سريع ≤30 يوم · ضمن المعتاد 31–60 يوم · متأخر &gt;60 يوم. المدة = تاريخ الأمر → تاريخ الاستلام (آخر شحنة مستلمة)، أو حتى اليوم إن كان الأمر مفتوحًا.</p>
      <div style="overflow:auto;max-height:60vh">
      <table>
        <thead><tr><th>رقم الأمر</th><th>المورد</th><th>النوع</th><th>تاريخ الطلب</th><th>تاريخ الاستلام</th><th>الحالة</th><th>المدة (يوم)</th><th>التصنيف</th></tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td>${r.o.po_number||'—'}</td>
              <td>${supplierName(r.o.supplier_id)}</td>
              <td>${r.o.order_type||'—'}</td>
              <td>${fmtDate(r.o.order_date)}</td>
              <td>${r.receivedDate?fmtDate(r.receivedDate):'—'}</td>
              <td>${r.o.status}</td>
              <td><strong>${r.ageDays}</strong></td>
              <td><span class="badge ${r.slaClass}">${r.sla}</span></td>
            </tr>`).join('')}
          ${rows.length===0?'<tr><td colspan="8" class="muted">لا توجد أوامر بتاريخ طلب مسجّل</td></tr>':''}
        </tbody>
      </table>
      </div>
    </div>
  `;
  root.querySelector('#exp-aging').onclick = () => exportToExcel(rows.map(r=>({
    رقم_الأمر:r.o.po_number, المورد:supplierName(r.o.supplier_id), النوع:r.o.order_type,
    تاريخ_الطلب:r.o.order_date, تاريخ_الاستلام:r.receivedDate, الحالة:r.o.status, المدة_بالأيام:r.ageDays, التصنيف:r.sla
  })), 'aging_report');
}

function computeCommitment(f){
  if (!f.need_by_date) return null;
  const d = new Date(f.need_by_date);
  const totalDays = (parseInt(f.production_days)||0)+(parseInt(f.shipping_days)||0)+(parseInt(f.customs_days)||0)+(parseInt(f.inspection_days)||0)+(parseInt(f.margin_days)||0);
  d.setDate(d.getDate() - totalDays);
  return d.toISOString().slice(0,10);
}

          if (error) throw error;
          toast('تم الحفظ'); closeModal(); await refreshAll(); renderActiveTab();
        } else {
          payload.created_by = currentUser.id;
          const { data: newSample, error } = await sb.from('erp_samples').insert(payload).select().single();

function renderReceiptLinesBlock(receipt){
  const lines = receiptLinesFor(receipt.id);
  return `
    <div class="card" style="margin-top:10px">
      <div class="toolbar"><strong>بنود الاستلام (الكميات الفعلية)</strong>${canWriteReceipts()?'<button class="btn small" id="add-receipt-line">+ بند استلام</button>':''}</div>
      <table>
        <thead><tr><th>الصنف</th><th>الكمية المطلوبة</th><th>الكمية المستلمة فعليًا</th><th>الفرق</th><th>ملاحظات</th><th></th></tr></thead>
        <tbody id="receipt-lines-body">
        ${lines.map(l=>{
          const diff = (l.received_quantity||0) - (l.ordered_quantity||0);
          const diffBadge = diff===0 ? '<span class="badge ok">مطابق</span>' : `<span class="badge ${diff<0?'bad':'warn'}">${diff>0?'+':''}${fmtNum(diff)}</span>`;
          return `<tr>
            <td>${l.item_name}</td><td>${l.ordered_quantity!=null?fmtNum(l.ordered_quantity):'—'}</td>
            <td>${fmtNum(l.received_quantity)}</td>

            <td>${l.discrepancy_notes||'—'}</td>
            <td>${canDelete()?`<button class="btn small" data-lid="${l.id}" data-act="del-receipt-line">حذف</button>`:''}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function wireReceiptLinesBlock(root, receipt){

    const poLines = receipt.po_id ? linesFor(receipt.po_id) : [];
    openModal(`
      <h3>بند استلام جديد</h3>
      ${poLines.length ? `<div class="field"><label>اختر من بنود الأمر (اختياري)</label><select id="rl-po_line_item_id"><option value="">— إدخال يدوي —</option>${poLines.map(l=>`<option value="${l.id}">${l.item_name} (المطلوب: ${fmtNum(l.quantity)})</option>`).join('')}</select></div>` : ''}
      <div class="field"><label>اسم الصنف</label><input id="rl-item_name"></div>
      <div class="row">
        <div class="field"><label>الكمية المطلوبة (حسب الأمر)</label><input type="number" step="0.01" id="rl-ordered_quantity"></div>
        <div class="field"><label>الكمية المستلمة فعليًا</label><input type="number" step="0.01" id="rl-received_quantity"></div>
      </div>
      <div class="field"><label>الوحدة</label><input id="rl-unit"></div>
      <div class="field"><label>ملاحظات الفرق (إن وجد)</label><textarea id="rl-discrepancy_notes" placeholder="مثال: تلف في الشحن، نقص من المورد..."></textarea></div>
      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="save-receipt-line">حفظ</button>
        <button class="btn" id="back-receipt-line">رجوع</button>
      </div>
    `, (r2)=>{
      const sel = r2.querySelector('#rl-po_line_item_id');
      if (sel) sel.addEventListener('change', () => {
        const line = poLines.find(l=>l.id===sel.value);
        if (line) {
          r2.querySelector('#rl-item_name').value = line.item_name;
          r2.querySelector('#rl-ordered_quantity').value = line.quantity;
        }
      });
      r2.querySelector('#back-receipt-line').onclick = () => openWarehouseReceiptModal(receipt);
      r2.querySelector('#save-receipt-line').onclick = async () => {
        const payload = {
          receipt_id: receipt.id,
          po_line_item_id: sel ? (sel.value || null) : null,
          item_name: val('rl-item_name'),
          ordered_quantity: parseFloat(val('rl-ordered_quantity'))||null,
          received_quantity: parseFloat(val('rl-received_quantity'))||0,
          unit: val('rl-unit')||null,
          discrepancy_notes: val('rl-discrepancy_notes')||null,
          created_by: currentUser.id,
        };
        const { error } = await sb.from('erp_warehouse_receipt_lines').insert(payload);
        if (error) { toast('خطأ: '+error.message); return; }
        await refreshAll();
        openWarehouseReceiptModal(cache.warehouseReceipts.find(r=>r.id===receipt.id));
      };
    });
  };
  root.querySelectorAll('[data-act="del-receipt-line"]').forEach(b=>{
    b.onclick = async () => {
      if (!confirm('حذف هذا البند؟')) return;
      const { error } = await sb.from('erp_warehouse_receipt_lines').delete().eq('id', b.dataset.lid);
      if (error) { toast('خطأ: '+error.message); return; }
      await refreshAll();
      openWarehouseReceiptModal(cache.warehouseReceipts.find(r=>r.id===receipt.id));
    };
  });
}

function renderComparison(root){
  // Compute stats per supplier
  const stats = cache.suppliers.map(s => {
    const orders = cache.orders.filter(o=>o.supplier_id===s.id);
    const lines = orders.flatMap(o=>linesFor(o.id));
    const totalSpend = lines.reduce((sum,l)=>sum+(l.line_total||l.unit_price*l.quantity||0),0);
    const payments = orders.flatMap(o=>paymentsFor(o.id));
    const paidPayments = payments.filter(p=>p.status==='مُحوَّلة');
    const shipments = orders.flatMap(o=>shipmentsFor(o.id));
    const receivedShipments = shipments.filter(sh=>sh.received_date);

    return {
      ...s, orderCount: orders.length, lineCount: lines.length, totalSpend,
      paymentCount: payments.length, paidCount: paidPayments.length,
      shipmentCount: shipments.length, receivedCount: receivedShipments.length,
      currencies: [...new Set(orders.map(o=>o.currency))].join(', '),
    };
  }).filter(s=>s.orderCount > 0).sort((a,b)=>b.totalSpend-a.totalSpend);

  const totalSpendAll = stats.reduce((s,x)=>s+x.totalSpend,0);

  root.innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <h4 style="margin-bottom:10px">مقارنة الموردين — ملخص تنفيذي</h4>
      <div style="margin-bottom:10px">
        <canvas id="chart-supplier-compare" style="max-height:300px"></canvas>
      </div>
      <button class="btn small" id="exp-compare">تصدير إكسل</button>
    </div>
    <div class="compare-grid">
      ${stats.map((s, i)=>`
        <div class="supplier-card">
          <h4>${i+1}. ${s.name} ${!s.is_active?'<span class="badge bad">غير نشط</span>':''}</h4>
          <div class="stat-row"><span class="stat-label">الدولة</span><span class="stat-value">${s.country||'—'}</span></div>
          <div class="stat-row"><span class="stat-label">عدد الأوامر</span><span class="stat-value">${s.orderCount}</span></div>
          <div class="stat-row"><span class="stat-label">عدد البنود</span><span class="stat-value">${s.lineCount}</span></div>
          <div class="stat-row"><span class="stat-label">إجمالي الإنفاق</span><span class="stat-value">${fmtNum(s.totalSpend)}</span></div>
          <div class="stat-row"><span class="stat-label">نسبة من الإجمالي</span><span class="stat-value ${totalSpendAll && s.totalSpend/totalSpendAll>0.5?'style="color:var(--danger);font-weight:700"':''}">${totalSpendAll ? Math.round(s.totalSpend/totalSpendAll*100) : 0}%</span></div>
          <div class="stat-row"><span class="stat-label">العملات</span><span class="stat-value">${s.currencies||'—'}</span></div>
          <div class="stat-row"><span class="stat-label">الدفعات (مسددة/إجمالي)</span><span class="stat-value">${s.paidCount}/${s.paymentCount}</span></div>
          <div class="stat-row"><span class="stat-label">الشحنات (مُستلمة/إجمالي)</span><span class="stat-value">${s.receivedCount}/${s.shipmentCount}</span></div>
          <div class="stat-row"><span class="stat-label">مهلة التوريد</span><span class="stat-value">${s.lead_time_days ? s.lead_time_days+' يوم' : '—'}</span></div>
          <div class="stat-row"><span class="stat-label">شروط الدفع</span><span class="stat-value">${s.payment_terms||'—'}</span></div>
        </div>
      `).join('')}
      ${stats.length===0 ? '<div class="card"><p class="muted">لا توجد بيانات كافية للمقارنة</p></div>' : ''}
    </div>
  `;

  root.querySelector('#exp-compare').onclick = () => exportToExcel(stats.map(s=>({
    المورد:s.name, الدولة:s.country, عدد_الأوامر:s.orderCount, إجمالي_الإنفاق:s.totalSpend,
    النسبة_من_الإجمالي: totalSpendAll ? Math.round(s.totalSpend/totalSpendAll*100)+'%' : '0%',
    الدفعات_المسددة:s.paidCount, إجمالي_الدفعات:s.paymentCount,
    الشحنات_المستلمة:s.receivedCount, إجمالي_الشحنات:s.shipmentCount,
    مهلة_التوريد:s.lead_time_days, شروط_الدفع:s.payment_terms
  })), 'supplier_comparison');

  // Comparison chart
  setTimeout(()=>{
    const ctx = document.getElementById('chart-supplier-compare');
    if (!ctx || stats.length === 0) return;
    chartInstances['supplier-compare'] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: stats.map(s=>s.name),
        datasets: [
          { label: 'إجمالي الإنفاق', data: stats.map(s=>s.totalSpend), backgroundColor: '#2563eb', borderRadius: 4 },
          { label: 'عدد الأوامر ×1000', data: stats.map(s=>s.orderCount*1000), backgroundColor: '#7c3aed', borderRadius: 4 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: true,
        plugins: { legend: { position: 'bottom', rtl: true, labels: { font: { family: 'Noto Sans Arabic', size: 11 } } } },
        scales: { y: { beginAtZero: true, ticks: { callback: v=>Number(v).toLocaleString('ar-SA',{notation:'compact'}) } } }
      }
    });
  }, 50);
}

    <div class="card">
      <strong>المستخدمون (${cache.profiles.length})</strong>
      ${fullAccess ? '<p class="muted" style="margin-top:6px">صلاحية Full Access تتيح حذف أوامر الشراء (فرديًا أو جماعيًا). امنحها فقط لمن تثق به تمامًا.</p>' : ''}
      <div style="overflow:auto;max-height:65vh;margin-top:10px">
      <table>
        <thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الدور الحالي</th><th>تغيير الدور</th><th>Full Access</th></tr></thead>
        <tbody>
          ${cache.profiles.map(p=>`
            <tr>
              <td>${p.full_name||'—'}</td><td>${p.username||'—'}</td>
              <td>${p.role==='pending'?'<span class="badge warn">قيد المراجعة</span>':p.role}</td>
              <td>
                <select data-id="${p.id}" class="role-select" style="width:auto;display:inline-block">
                  ${['pending','data_entry','manager','finance','viewer','warehouse'].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${r}</option>`).join('')}
                </select>
              </td>
              <td>
                ${fullAccess
                  ? `<input type="checkbox" class="full-access-check" data-id="${p.id}" ${p.is_full_access?'checked':''}>`
                  : (p.is_full_access ? '<span class="badge ok">✓</span>' : '<span class="muted">—</span>')}
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
  root.querySelectorAll('.role-select').forEach(sel=>{
    sel.onchange = async () => {
      const { error } = await sb.from('erp_profiles').update({role: sel.value}).eq('id', sel.dataset.id);
      if (error) { toast('خطأ: '+error.message); return; }
      toast('تم تحديث الدور'); await refreshAll(); renderActiveTab();
    };
  });
  if (fullAccess) {
    root.querySelectorAll('.full-access-check').forEach(cb=>{
      cb.onchange = async () => {
        const grant = cb.checked;
        if (grant && !confirm('منح صلاحية Full Access (حذف أوامر الشراء فرديًا/جماعيًا) لهذا المستخدم؟')) { cb.checked = false; return; }
        const { error } = await sb.from('erp_profiles').update({is_full_access: grant}).eq('id', cb.dataset.id);
        if (error) { toast('خطأ: '+error.message); cb.checked = !grant; return; }
        toast(grant ? 'تم منح Full Access' : 'تم سحب Full Access'); await refreshAll(); renderActiveTab();
      };
    });
  }
}

// ============================================================
// INIT
// ============================================================
(async function init(){
  // دفاعي: لو تعطّل قفل المتصفح (navigator.locks) القديم من جلسة سابقة، لا نترك الشاشة فارغة إلى الأبد
  const sessionPromise = sb.auth.getSession();
  const timeoutPromise = new Promise(resolve => setTimeout(() => resolve({ data: { session: null }, timedOut: true }), 8000));
  const result = await Promise.race([sessionPromise, timeoutPromise]);
  if (result.timedOut) {
    console.warn('getSession() timed out after 8s (possible stuck navigator.locks); showing login screen');
  }
  currentUser = result.data.session ? result.data.session.user : null;
  await boot();
})();
</script>
</body>
